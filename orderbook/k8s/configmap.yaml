apiVersion: v1
kind: ConfigMap
metadata:
  name: haveno-orderbook-config
  labels:
    app: haveno-orderbook
data:
  # Haveno network to observe.
  HAVENO_BASE_CURRENCY_NETWORK: "XMR_MAINNET"
  # REST API bind settings.
  HAVENO_REST_HOST: "0.0.0.0"
  HAVENO_REST_PORT: "8080"
  # Application/P2P data directory (mounted as a PVC below).
  HAVENO_APP_DATA_DIR: "/data"
  # Reachable monerod for reserve-spent offer validation. Point at a sidecar or an
  # external mainnet Monero node. Example for a sidecar in the same pod:
  HAVENO_XMR_NODE: "http://127.0.0.1:18081"
  # Privacy: keep maker onion addresses out of API responses by default.
  HAVENO_EXPOSE_MAKER_ADDRESS: "false"
  # Cap on rows returned by /trades.
  HAVENO_MAX_TRADES: "5000"
  JAVA_OPTS: "-XX:MaxRAM=2g"
